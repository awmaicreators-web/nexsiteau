<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" fill="none">
  <!-- Definitions & Gradients -->
  <defs>
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F5"/>
      <stop offset="65%" stop-color="#F6F3EC"/>
      <stop offset="100%" stop-color="#EFEBE2"/>
    </linearGradient>
    <linearGradient id="stoneWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DFC8AC"/>
      <stop offset="40%" stop-color="#EEDBC3"/>
      <stop offset="100%" stop-color="#D7BEA2"/>
    </linearGradient>
    <linearGradient id="glassWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3B48" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#3A4D5E" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#212C36" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E8EFF5"/>
      <stop offset="100%" stop-color="#D0E2EE"/>
    </linearGradient>
    <linearGradient id="terraceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFE3D3"/>
      <stop offset="100%" stop-color="#DBCAB4"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.04"/>
    </filter>
  </defs>

  <style>
    .serif-title { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; }
    .sans-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="800" fill="url(#warmBg)"/>

  <!-- Top Concept Indicator Bar -->
  <rect x="0" y="0" width="1200" height="30" fill="#424D57"/>
  <text x="36" y="20" class="sans-text" font-size="11" font-weight="600" letter-spacing="1.5" fill="#C5CFD6">DESIGN CONCEPT</text>
  <line x1="165" y1="16" x2="360" y2="16" stroke="#687784" stroke-width="1"/>

  <!-- Main Website Header -->
  <g id="header">
    <rect x="0" y="30" width="1200" height="70" fill="#FAF8F5"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#E6E0D4" stroke-width="1"/>
    
    <!-- Logo -->
    <text x="50" y="74" class="serif-title" font-size="28" font-weight="700" fill="#0C1B2A">Practice &amp; Co.</text>
    
    <!-- Navigation Links -->
    <g transform="translate(630, 71)" class="sans-text" font-size="14" font-weight="500" fill="#3D4B57">
      <text x="0" y="0">About</text>
      <text x="70" y="0">Expertise</text>
      <text x="160" y="0">Insights</text>
      <text x="245" y="0">Contact</text>
    </g>
    
    <!-- Header CTA Button -->
    <rect x="965" y="47" width="185" height="38" rx="4" fill="#0C1B2A"/>
    <text x="988" y="71" class="sans-text" font-size="13" font-weight="600" fill="#FFFFFF">Book a consultation</text>
    <path d="M1126 67 L1134 67 M1130 63 L1134 67 L1130 71" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Hero Split Stage -->
  <g id="hero-stage">
    <!-- Left Hero Copy (~48% width) -->
    <g id="left-copy" transform="translate(50, 140)">
      <text x="0" y="70" class="serif-title" font-size="58" font-weight="700" fill="#0C1B2A" line-height="1.08">
        <tspan x="0" dy="0">Clarity for your</tspan>
        <tspan x="0" dy="68">next business</tspan>
        <tspan x="0" dy="68">decision.</tspan>
      </text>

      <text x="0" y="250" class="serif-title" font-size="19" font-weight="400" fill="#4B5663">
        Practical advice. Clear direction. A considered approach.
      </text>

      <!-- Primary Action Button -->
      <g transform="translate(0, 285)">
        <rect x="0" y="0" width="195" height="46" rx="4" fill="#0C1B2A"/>
        <text x="24" y="28" class="sans-text" font-size="14" font-weight="600" fill="#FFFFFF">Discuss your needs</text>
        <path d="M165 24 L175 24 M171 19 L175 24 L171 29" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Right Hero Architectural Illustration (~52% width) -->
    <g id="right-visual" transform="translate(505, 125)">
      <clipPath id="archClip">
        <rect x="0" y="0" width="645" height="395" rx="4"/>
      </clipPath>
      
      <g clip-path="url(#archClip)">
        <!-- Sky Backdrop with City Silhouette -->
        <rect x="0" y="0" width="645" height="395" fill="url(#skyGrad)"/>
        
        <!-- Distant City Skyline & Water -->
        <path d="M0 240 Q150 238 320 242 T645 240 L645 270 L0 270 Z" fill="#B9CAD6" opacity="0.6"/>
        <g fill="#A3B8C7" opacity="0.45">
          <rect x="40" y="200" width="14" height="40"/>
          <rect x="60" y="185" width="22" height="55"/>
          <rect x="90" y="210" width="18" height="30"/>
          <rect x="130" y="195" width="26" height="45"/>
          <rect x="190" y="205" width="16" height="35"/>
          <rect x="230" y="180" width="20" height="60"/>
        </g>
        
        <!-- Distant Water Line -->
        <rect x="0" y="245" width="645" height="25" fill="#88A5B8" opacity="0.5"/>

        <!-- Sunlit Sandstone Building Structure -->
        <!-- Center Arch Pillar -->
        <rect x="260" y="0" width="170" height="395" fill="url(#stoneWall)"/>
        <!-- Texture Lines for Stone blocks -->
        <line x1="260" y1="80" x2="430" y2="80" stroke="#C5B095" stroke-width="1"/>
        <line x1="260" y1="160" x2="430" y2="160" stroke="#C5B095" stroke-width="1"/>
        <line x1="260" y1="240" x2="430" y2="240" stroke="#C5B095" stroke-width="1"/>
        <line x1="260" y1="320" x2="430" y2="320" stroke="#C5B095" stroke-width="1"/>
        
        <!-- Right Glass Pavilion -->
        <rect x="430" y="0" width="215" height="395" fill="url(#glassWall)"/>
        <!-- Glass Mullions & Framework -->
        <line x1="430" y1="0" x2="430" y2="395" stroke="#18222A" stroke-width="4"/>
        <line x1="535" y1="0" x2="535" y2="395" stroke="#18222A" stroke-width="3"/>
        <line x1="430" y1="170" x2="645" y2="170" stroke="#18222A" stroke-width="3"/>
        
        <!-- Interior Warm Lighting & Seating Furniture Silhouette -->
        <rect x="445" y="250" width="60" height="40" rx="3" fill="#A8947C" opacity="0.8"/>
        <rect x="520" y="255" width="30" height="35" rx="2" fill="#7D6F5E" opacity="0.8"/>
        <rect x="560" y="250" width="65" height="40" rx="3" fill="#A8947C" opacity="0.8"/>

        <!-- Sunlit Terrace Courtyard Floor -->
        <polygon points="0,270 645,270 645,395 0,395" fill="url(#terraceGrad)"/>
        <line x1="0" y1="330" x2="645" y2="330" stroke="#C8B8A2" stroke-width="1"/>
        
        <!-- Low Planter & Stone Balustrade with Olive Trees -->
        <rect x="0" y="260" width="260" height="45" fill="#D7BEA2"/>
        <line x1="0" y1="260" x2="260" y2="260" stroke="#C2AA8E" stroke-width="1.5"/>

        <!-- Olive Trees Foliage (Organic Greens) -->
        <g id="trees">
          <!-- Tree 1 -->
          <ellipse cx="65" cy="205" rx="38" ry="50" fill="#4F5D44" opacity="0.9"/>
          <ellipse cx="85" cy="180" rx="42" ry="45" fill="#6B7C59" opacity="0.9"/>
          <ellipse cx="115" cy="210" rx="36" ry="45" fill="#586A4C" opacity="0.9"/>
          <ellipse cx="90" cy="225" rx="45" ry="35" fill="#445239" opacity="0.85"/>
          <path d="M85 260 L85 220" stroke="#3D3025" stroke-width="3.5"/>
          
          <!-- Tree 2 (Next to glass pavilion) -->
          <ellipse cx="400" cy="245" rx="28" ry="36" fill="#5A6D4B" opacity="0.9"/>
          <ellipse cx="415" cy="225" rx="30" ry="34" fill="#71865F" opacity="0.85"/>
          <ellipse cx="385" cy="240" rx="24" ry="32" fill="#4A5A3C" opacity="0.9"/>
          <path d="M400 270 L400 240" stroke="#3D3025" stroke-width="3"/>
        </g>
      </g>
      <rect x="0" y="0" width="645" height="395" rx="4" stroke="#D8D0C3" stroke-width="1"/>
    </g>
  </g>

  <!-- Horizontal Dividing Section Line -->
  <line x1="50" y1="545" x2="1150" y2="545" stroke="#E4DDCF" stroke-width="1"/>

  <!-- Three Columns Bottom Services Section -->
  <g id="three-columns" transform="translate(50, 565)">
    <!-- Column 1: Business Advisory -->
    <g transform="translate(0, 0)">
      <!-- Sprig / Leaf Icon -->
      <path d="M12 28 C12 28 8 16 18 10 C24 6 28 8 28 8 C28 8 26 18 18 22 C14 24 12 28 12 28 Z" stroke="#3E6B65" stroke-width="1.8" fill="none"/>
      <path d="M18 10 C18 10 20 18 14 26" stroke="#3E6B65" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M10 22 C12 18 18 16 18 16" stroke="#3E6B65" stroke-width="1.4"/>
      
      <text x="0" y="60" class="serif-title" font-size="21" font-weight="700" fill="#0C1B2A">Business advisory</text>
      <text x="0" y="86" class="sans-text" font-size="13.5" font-weight="400" fill="#58636E" width="310">
        <tspan x="0" dy="0">Practical, commercially minded advice</tspan>
        <tspan x="0" dy="21">to help you navigate change, manage risk</tspan>
        <tspan x="0" dy="21">and unlock opportunity.</tspan>
      </text>
    </g>

    <!-- Column 2: Corporate Strategy -->
    <g transform="translate(390, 0)">
      <line x1="-30" y1="5" x2="-30" y2="135" stroke="#E6E0D4" stroke-width="1"/>
      <!-- Ascending Bars Icon -->
      <path d="M10 28 L10 20 M16 28 L16 14 M22 28 L22 8 M28 28 L28 16" stroke="#2D4D6B" stroke-width="2" stroke-linecap="round"/>
      
      <text x="0" y="60" class="serif-title" font-size="21" font-weight="700" fill="#0C1B2A">Corporate strategy</text>
      <text x="0" y="86" class="sans-text" font-size="13.5" font-weight="400" fill="#58636E">
        <tspan x="0" dy="0">Clear, independent thinking to support</tspan>
        <tspan x="0" dy="21">smarter decisions and a stronger</tspan>
        <tspan x="0" dy="21">future for your business.</tspan>
      </text>
    </g>

    <!-- Column 3: Ongoing Support -->
    <g transform="translate(775, 0)">
      <line x1="-30" y1="5" x2="-30" y2="135" stroke="#E6E0D4" stroke-width="1"/>
      <!-- People / Team Icon -->
      <circle cx="14" cy="14" r="4" stroke="#355670" stroke-width="1.8" fill="none"/>
      <circle cx="26" cy="14" r="4" stroke="#355670" stroke-width="1.8" fill="none"/>
      <circle cx="20" cy="11" r="4" stroke="#355670" stroke-width="1.8" fill="none"/>
      <path d="M7 28 C7 24 10 22 14 22 C18 22 21 24 21 28" stroke="#355670" stroke-width="1.8" fill="none"/>
      <path d="M19 28 C19 24 22 22 26 22 C30 22 33 24 33 28" stroke="#355670" stroke-width="1.8" fill="none"/>
      
      <text x="0" y="60" class="serif-title" font-size="21" font-weight="700" fill="#0C1B2A">Ongoing support</text>
      <text x="0" y="86" class="sans-text" font-size="13.5" font-weight="400" fill="#58636E">
        <tspan x="0" dy="0">A trusted partner who stays alongside</tspan>
        <tspan x="0" dy="21">you, providing ongoing advice as your</tspan>
        <tspan x="0" dy="21">needs evolve.</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom Preview Border Teaser -->
  <g transform="translate(0, 725)">
    <rect x="0" y="0" width="1200" height="75" fill="#EAE5DC" opacity="0.6"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#DDD6C8" stroke-width="1"/>
    <text x="50" y="42" class="serif-title" font-size="26" font-weight="600" fill="#1B2835">A clear path forward.</text>
    <line x1="320" y1="36" x2="420" y2="36" stroke="#8795A1" stroke-width="1"/>
  </g>
</svg>
